spring:
  application:
    name: api-sunat
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/apisunat?createDatabaseIfNotExist=true}
    username: ${DB_USUARIO:apisunat}
    password: ${DB_CLAVE:apisunat}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo manejan las migraciones de Flyway; Hibernate solo comprueba que las entidades coincidan
      ddl-auto: validate

# El agente (saas-agent) usa el 8080, así que esta API va en otro puerto para poder correr las dos a la vez
server:
  port: 8081

# Por defecto apunta al servicio de pruebas (beta) de la SUNAT con las credenciales públicas de pruebas.
# Para otro RUC o para producción se cambian con variables de entorno.
sunat:
  url: ${SUNAT_URL:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
  ruc: ${SUNAT_RUC:20100066603}
  usuario: ${SUNAT_USUARIO:MODDATOS}
  clave: ${SUNAT_CLAVE:MODDATOS}
  # La llave que piden los endpoints /api en la cabecera X-API-Key. Vacía: no se pide (solo para desarrollo; el perfil prod la exige).
  api-key: ${SUNAT_API_KEY:}
  # La serie de las facturas (la SUNAT exige 4 caracteres y que empiece con F)
  serie-factura: ${SUNAT_SERIE_FACTURA:F001}
  serie-boleta: ${SUNAT_SERIE_BOLETA:B001}
  # Días calendario después del día de emisión en que todavía se puede enviar una factura
  plazo-envio-dias: ${SUNAT_PLAZO_ENVIO_DIAS:1}
  conexion-timeout-ms: 5000
  lectura-timeout-ms: 30000
  # Los datos de quien emite. Con el beta sirven los de ejemplo; para emitir de verdad se cambian con variables de entorno.
  emisor:
    razon-social: ${SUNAT_EMISOR_RAZON_SOCIAL:EMPRESA DE PRUEBAS SAC}
    nombre-comercial: ${SUNAT_EMISOR_NOMBRE_COMERCIAL:}
    direccion: ${SUNAT_EMISOR_DIRECCION:}
    codigo-establecimiento: ${SUNAT_EMISOR_ESTABLECIMIENTO:0000}
  # El certificado digital (.p12) para firmar. Sin él la aplicación arranca, pero no puede firmar facturas.
  certificado:
    ruta: ${SUNAT_CERTIFICADO_RUTA:}
    clave: ${SUNAT_CERTIFICADO_CLAVE:}
  # Vuelve a enviar lo que quedó pendiente (la SUNAT caída, un corte de red...)
  reintentos:
    habilitado: ${SUNAT_REINTENTOS_HABILITADO:true}
    intervalo-segundos: ${SUNAT_REINTENTOS_INTERVALO_SEGUNDOS:60}
    lote: 20
    minutos-maximo-enviando: 10
  # Antes de reenviar, preguntar si la SUNAT ya tiene la factura. Solo existe en producción (el beta no lo tiene).
  consulta-cdr:
    habilitada: ${SUNAT_CONSULTA_CDR_HABILITADA:false}
    url: ${SUNAT_CONSULTA_CDR_URL:https://e-factura.sunat.gob.pe/ol-it-wsconscpegem/billConsultService}
  # Las boletas se informan a la SUNAT con un resumen diario
  resumen:
    habilitado: ${SUNAT_RESUMEN_HABILITADO:true}
    # Cada día a las 22:00 hora de Lima: segundos minutos horas día mes día-de-semana
    cron: ${SUNAT_RESUMEN_CRON:0 0 22 * * *}
    intervalo-consulta-segundos: ${SUNAT_RESUMEN_INTERVALO_SEGUNDOS:60}
    plazo-dias: 7
