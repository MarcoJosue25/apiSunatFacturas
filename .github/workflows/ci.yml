name: CI

# Corre en cada push a cualquier rama y en los pull requests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # La misma base que usa la aplicación (MySQL 8.4)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apisunat
          MYSQL_USER: apisunat
          MYSQL_PASSWORD: apisunat
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_URL: jdbc:mysql://localhost:3306/apisunat
      DB_USUARIO: root
      DB_CLAVE: root

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar y correr los tests
        run: ./mvnw -B clean test

  # Comprueba que la imagen de Docker se arma (compila con el JDK y deja solo el .jar en una imagen con JRE). No la publica.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar la imagen
        run: docker build -t api-sunat:ci .
